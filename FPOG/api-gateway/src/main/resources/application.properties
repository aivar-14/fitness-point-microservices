# Your existing gateway configuration
spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890

spring.cloud.gateway.routes[0].id=dietplan-service-route
spring.cloud.gateway.routes[0].uri=lb://dietplan-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/diet/**

spring.cloud.gateway.routes[1].id=workout-service-route
spring.cloud.gateway.routes[1].uri=lb://workout-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workouts/**
spring.cloud.gateway.routes[1].predicates[1]=Path=/api/workout-sessions/**

spring.cloud.gateway.routes[2].id=fitnesspoint-service-route
spring.cloud.gateway.routes[2].uri=lb://fitnesspoint
spring.cloud.gateway.routes[2].predicates[0]=Path=/**