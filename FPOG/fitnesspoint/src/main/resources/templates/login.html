<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>FitnessPoint - Login</title>
  </head>
  <body>
    <div class="container" id="container">
      <!-- SIGN UP -->
      <div class="sign-up">
        <form th:action="@{/signup}" method="post">
          <h1>Create Account</h1>
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required />
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required />
          <button type="submit">Register</button>
          <div th:if="${signupError}" style="color:red; font-size:14px; margin-top:5px;">[[${signupError}]]</div>
          <div th:if="${signupSuccess}" style="color:green; font-size:14px; margin-top:5px;">[[${signupSuccess}]]</div>
        </form>
      </div>

      <!-- SIGN IN -->
      <div class="sign-in">
        <form th:action="@{/login}" method="post">
          <h1>Sign In</h1>
          <input type="text" name="username" placeholder="Username" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Sign In</button>
          <div th:if="${loginError}" style="color:red; font-size:14px; margin-top:5px;">[[${loginError}]]</div>
          <div th:if="${signupSuccess}" style="color:green; font-size:14px; margin-top:5px;">[[${signupSuccess}]]</div>
        </form>
      </div>

      <!-- TOGGLE -->
      <div class="toogle-container">
        <div class="toogle">
          <div class="toogle-panel toogle-left">
            <h1>Welcome User!</h1>
            <p>If you already have an account</p>
            <button class="hidden" id="login">Sign In</button>
          </div>
          <div class="toogle-panel toogle-right">
            <h1>Hello, User!</h1>
            <p>If you don't have an account</p>
            <button class="hidden" id="register">Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
